name: Test & Release

# Every push runs the tests and packs the server. A v* tag also builds the Windows desktop
# installer and attaches everything to the GitHub Release: the verified server package (what the
# Pi installer downloads), the .exe, latest.yml and the .blockmap (what the silent updater reads).

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  test-and-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests (no install needed; the core has no dependencies)
        run: npm test
      - name: Check the installer parses
        run: bash -n server/install.sh
      - name: Build server package
        run: node kit/ops/pack-server.js
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-package
          path: dist/*-server*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-server-*.tar.gz
            dist/*-server.tar.gz
            dist/*-server.tar.gz.sha256
          generate_release_notes: true

